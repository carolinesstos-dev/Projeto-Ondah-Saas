<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <title>Catálogo - Ondah</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="d-flex">
    <div id="sidebar" class="bg-white border-end"></div>

    <div class="container py-5">
      <h2 class="mb-4">Catálogo</h2>
      <p class="text-muted">
        Filtre e envie pro seu cliente o que está disponível agora.
      </p>

      <div class="card p-3 mb-4">
  <form id="formFiltro" class="row g-2">
    <div class="col-md-2">
      <input type="text" id="filtroCodigo" class="form-control" placeholder="Código">
    </div>
    <div class="col-md-3">
      <input type="text" id="filtroTamanho" class="form-control" placeholder="Tamanho (ex: G)">
    </div>
    <div class="col-md-3">
      <input type="text" id="filtroCor" class="form-control" placeholder="Cor">
    </div>
    <div class="col-md-2">
      <input type="text" id="filtroModelo" class="form-control" placeholder="Modelo">
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-primary w-100">Filtrar</button>
    </div>
  </form>
  <button id="btnCompartilhar" class="btn btn-outline-success btn-sm mt-2">
    📤 Compartilhar este resultado no WhatsApp
  </button>
</div>

<div id="resultadoCatalogo" class="row g-3"></div>
  </div>
  </div>

  <script src="sidebar.js"></script>
  <script src="catalogo.js"></script>
</body>

</html>
