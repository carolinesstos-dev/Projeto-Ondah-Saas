<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Perfil - Ondah</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="d-flex">
    <div id="sidebar" class="bg-white border-end"></div>

    <div class="container py-5" style="max-width: 600px;">
      <h2 class="mb-4">Perfil e Configurações</h2>

      <div class="card p-4 mb-4">
        <h5 class="mb-3">Meus dados</h5>
        <form id="formPerfil">
          <div class="mb-3">
            <label class="form-label">Seu nome</label>
            <input type="text" class="form-control" id="nome" required>
          </div>
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Nome da loja</label>
            <input type="text" class="form-control" id="nomeLoja" placeholder="Ex: Ondah Moda Praia">
          </div>
          <div class="mb-3">
            <label class="form-label">Contato (WhatsApp/telefone)</label>
            <input type="text" class="form-control" id="contato" placeholder="Ex: (11) 99999-9999">
          </div>
          <button type="submit" class="btn btn-primary">Salvar alterações</button>
          <span id="mensagemPerfil" class="ms-2 text-success"></span>
        </form>
      </div>

      <div class="card p-4 mb-4">
        <h5 class="mb-3">Alterar senha</h5>
        <form id="formSenha">
          <div class="mb-3">
            <label class="form-label">Senha atual</label>
            <input type="password" class="form-control" id="senhaAtual" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nova senha</label>
            <input type="password" class="form-control" id="novaSenha" required minlength="6">
          </div>
          <button type="submit" class="btn btn-outline-primary">Alterar senha</button>
          <span id="mensagemSenha" class="ms-2 text-success"></span>
        </form>
      </div>

      <div class="card p-4">
        <h5 class="mb-3">Link da sua loja</h5>
        <p class="text-muted small mb-2">Compartilhe esse link com seus clientes para eles verem seus produtos e fazerem pedidos.</p>
        <div class="input-group">
          <input type="text" class="form-control" id="linkLoja" readonly>
          <button class="btn btn-outline-secondary" type="button" id="btnCopiarLink">Copiar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="sidebar.js"></script>
  <script src="perfil.js"></script>
</body>
</html>
