<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Pedidos - Ondah</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="d-flex">
    <div id="sidebar" class="bg-white border-end"></div>

    <div class="container py-5">
      <h2 class="mb-4">Pedidos</h2>
      <div id="listaPedidos"></div>
    </div>
  </div>

  <!-- Modal de detalhe do pedido -->
  <div class="modal fade" id="modalDetalhe" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Pedido <span id="detalheNumero"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1"><strong>Cliente:</strong> <span id="detalheCliente"></span></p>
          <p class="mb-1"><strong>Contato:</strong> <span id="detalheContato"></span></p>
          <p class="mb-1"><strong>Retirada:</strong> <span id="detalheRetirada"></span></p>
          <p class="mb-3"><strong>Status:</strong> <span id="detalheStatus"></span></p>

          <hr>
          <div id="detalheItens"></div>
          <hr>
          <p class="text-end fw-bold">Total: R$ <span id="detalheTotal"></span></p>

          <button id="btnConfirmarPedido" class="btn btn-success w-100">Confirmar pedido</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="sidebar.js"></script>
  <script src="pedidos.js"></script>
</body>
</html>
