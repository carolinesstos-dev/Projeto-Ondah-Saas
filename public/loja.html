<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Loja - Ondah</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Loja</span>
        <button
          class="btn btn-outline-primary position-relative"
          id="btnCarrinho"
          data-bs-toggle="modal"
          data-bs-target="#modalCarrinho">
          Carrinho
          <span class="badge bg-danger rounded-pill" id="contadorCarrinho"
            >0</span
          >
        </button>
      </div>
    </nav>

    <div class="container pb-5">
      <div id="listaLoja" class="row g-4"></div>
    </div>

    <!-- Modal do Carrinho -->
    <div class="modal fade" id="modalCarrinho" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Seu carrinho</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="itensCarrinho"></div>
            <hr />
            <p>
              <strong>Total: R$ <span id="totalCarrinho">0.00</span></strong>
            </p>

            <div id="formCheckout">
              <input
                type="text"
                id="clienteNome"
                class="form-control mb-2"
                placeholder="Seu nome"
                required />
              <input
                type="text"
                id="clienteContato"
                class="form-control mb-2"
                placeholder="Telefone/WhatsApp" />

              <label class="form-label">Como prefere retirar?</label>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="retirada"
                  id="retiradaLocal"
                  value="local"
                  checked />
                <label class="form-check-label" for="retiradaLocal"
                  >Retirar no local</label
                >
              </div>
              <div class="form-check mb-3">
                <input
                  class="form-check-input"
                  type="radio"
                  name="retirada"
                  id="retiradaApp"
                  value="app_entrega" />
                <label class="form-check-label" for="retiradaApp">Retirada(Uber/99 pago pelo comprador)</label>
              </div>

              <button id="btnFinalizar" class="btn btn-success w-100">
                Finalizar Pedido
              </button>
            </div>

            <div
              id="confirmacaoPedido"
              class="alert alert-success d-none"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="loja.js"></script>
  </body>
</html>
