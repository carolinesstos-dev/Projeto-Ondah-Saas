<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Meus Produtos - Ondah</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="d-flex">
    <div id="sidebar" class="bg-white border-end"></div>

    <div class="container py-5">
      <h2 class="mb-4">Meus Produtos</h2>

      <div class="mb-3">
        <input type="text" id="busca" class="form-control" placeholder="Buscar por nome ou código...">
      </div>

      <div class="card p-3 mb-4">
        <h5>Novo Produto</h5>
        <form id="formNovoProduto" class="row g-2">
      <div class="col-md-10">
        <input type="text" id="nome" class="form-control" placeholder="Nome / Modelo" required>
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Adicionar</button>
      </div>
      <div class="col-md-12">
        <textarea id="descricao" class="form-control" placeholder="Breve descrição (opcional)" rows="2"></textarea>
      </div>
      </form>
      </div>

      <div id="listaProdutos"></div>
    </div>
  </div>

  <script src="sidebar.js"></script>
  <script src="produtos.js"></script>
</body>
</html>
